# ╔══════════════════════════════════════════════╗
# ║  CNB Pipeline                                 ║
# ║  1) 定时生成 GitHub 统计 SVG → 落仓库          ║
# ║  2) 手动触发：同步代码到 GitHub                ║
# ╚══════════════════════════════════════════════╝

main:
  # 每天 03:00 (UTC+8) 抓一次 GitHub 数据，生成 assets/github-stats.svg 并提交
  # 为什么落仓库而不是引 Vercel 卡片：CNB 的 img-src CSP 白名单只放行 *.cnb.cool 等，
  # 外部卡片既不在白名单、直连又超时；落仓库后 README 引 cnb.cool 的 raw 地址即可稳定渲染。
  "crontab: 0 3 * * *":
    - name: stats-svg
      docker:
        image: node:20
      imports:
        # 复用已有密钥仓库；GITHUB_TOKEN 用于提高 GitHub API 限流（未配置则走匿名请求）
        - https://cnb.cool/xindu.site/secret/-/blob/main/token.yaml
      env:
        GITHUB_USER: carolcoral
        STATS_OUT: assets/github-stats.svg
      lock:
        # 定时任务串行，避免两次运行并发提交冲突
        key: stats-svg
        wait: true
        cancel-in-wait: true
      stages:
        - name: generate
          script: node scripts/gen-stats.mjs --out "$STATS_OUT"

        - name: commit-if-changed
          script: |
            set -e
            git config user.email "cnb-ci@cnb.cool"
            git config user.name "CNB CI"

            if git diff --quiet -- "$STATS_OUT"; then
              echo "统计无变化，跳过提交"
              exit 0
            fi

            git add "$STATS_OUT"
            git commit -m "chore(stats): 更新 GitHub 统计 SVG [skip ci]"
            # 推回触发分支；本仓库未监听 push 事件，不会自触发
            git push origin "HEAD:${CNB_BRANCH:-main}"
            echo "已提交并推送 $STATS_OUT"

# 手动触发：将代码推送到 GitHub
$:
  web_trigger_push_github:
    - name: push-to-github
      docker:
        image: docker.io/alpine/git:latest
      imports:
        # 密钥仓库需包含 GITHUB_TOKEN（Personal Access Token，需 repo 权限）
        # 请根据实际密钥仓库路径修改此 URL
        - https://cnb.cool/xindu.site/secret/-/blob/main/token.yaml
      stages:
        - name: push to GitHub
          script: |
            git config --global user.email "cnb-ci@cnb.cool"
            git config --global user.name "CNB CI"

            # 移除 CNB 专属文件，不推送到 GitHub
            rm -rf .cnb/ .cnb.yml .codebuddy .github .ide
            git add -A
            git commit -m "chore: remove CNB config (auto-generated mirror)" --allow-empty

            # 推送到 GitHub
            git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/carolcoral/carolcoral.git
            git push github HEAD:refs/heads/${CNB_BRANCH} --force
            git push github --tags --force
