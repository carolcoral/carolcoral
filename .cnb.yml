# ╔══════════════════════════════════════════════╗
# ║  CNB Pipeline                                 ║
# ║  1) 定时生成 GitHub 统计 SVG → 落仓库          ║
# ║  2) 定时/手动：镜像组织公开仓库到 GitHub        ║
# ╚══════════════════════════════════════════════╝

main:
  # 每天 03:00 (UTC+8) 抓一次 GitHub 数据，生成 assets/github-stats.svg 并提交
  # 为什么落仓库而不是引 Vercel 卡片：CNB 的 img-src CSP 白名单只放行 *.cnb.cool 等，
  # 外部卡片既不在白名单、直连又超时；落仓库后 README 引 cnb.cool 的 raw 地址即可稳定渲染。
  "crontab: 0 3 * * *":
    - name: stats-svg
      docker:
        image: node:20
      imports:
        # 复用已有密钥仓库；GITHUB_TOKEN 用于提高 GitHub API 限流（未配置则走匿名请求）
        - https://cnb.cool/xindu.site/secret/-/blob/main/token.yaml
      env:
        GITHUB_USER: carolcoral
        STATS_OUT: assets/github-stats.svg
      lock:
        # 定时任务串行，避免两次运行并发提交冲突
        key: stats-svg
        wait: true
        cancel-in-wait: true
      stages:
        - name: generate
          script: node scripts/gen-stats.mjs --out "$STATS_OUT"

        - name: commit-if-changed
          script: |
            set -e
            git config user.email "cnb-ci@cnb.cool"
            git config user.name "CNB CI"

            if git diff --quiet -- "$STATS_OUT"; then
              echo "统计无变化，跳过提交"
              exit 0
            fi

            git add "$STATS_OUT"
            git commit -m "chore(stats): 更新 GitHub 统计 SVG [skip ci]"
            # 推回触发分支；本仓库未监听 push 事件，不会自触发
            git push origin "HEAD:${CNB_BRANCH:-main}"
            echo "已提交并推送 $STATS_OUT"

  # 每天 04:00 (UTC+8) 把组织下所有公开仓库镜像到 GitHub 同名仓库
  # 这里是编排入口：真正的同步逻辑在 scripts/sync-org-to-github.mjs（建仓 + 逐个镜像 + 单仓失败不影响其余）。
  # 注意：定时任务的 CNB_TOKEN 默认只能访问当前仓库，跨仓枚举需要组织管理员在
  # 「组织设置 → 仓库管控」中开启「允许定时任务跨仓操作」；未开启时同步会失败，
  # 可改用手动触发按钮（事件 web_trigger_push_github）执行。
  "crontab: 0 4 * * *":
    - name: sync-org-to-github
      docker:
        image: node:20
      imports:
        # 密钥仓库需包含 GITHUB_TOKEN（Personal Access Token，需 repo 权限）
        - https://cnb.cool/xindu.site/secret/-/blob/main/token.yaml
      env:
        ORG_SLUG: xindu.site
        GITHUB_OWNER: carolcoral
      lock:
        # 与手动触发共用一把锁，避免两次同步并发推送同一个 GitHub 仓库
        key: sync-org-to-github
        wait: true
        cancel-in-wait: true
      stages:
        - name: sync
          script: |
            set -e
            node scripts/sync-org-to-github.mjs --org "$ORG_SLUG" --owner "$GITHUB_OWNER"

# 手动触发
$:
  # 手动触发：镜像组织下所有公开仓库到 GitHub（与定时任务同一逻辑，用于补跑/首次全量同步）
  web_trigger_push_github:
    - name: sync-org-to-github
      docker:
        image: node:20
      imports:
        - https://cnb.cool/xindu.site/secret/-/blob/main/token.yaml
      env:
        ORG_SLUG: xindu.site
        GITHUB_OWNER: carolcoral
      lock:
        key: sync-org-to-github
        wait: true
        cancel-in-wait: true
      stages:
        - name: sync
          script: |
            set -e
            node scripts/sync-org-to-github.mjs --org "$ORG_SLUG" --owner "$GITHUB_OWNER"
