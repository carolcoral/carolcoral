# ╔══════════════════════════════════════════════╗
# ║  CNB → GitHub 自动镜像同步                    ║
# ║  push: 自动推送 | web_trigger: 手动强制同步   ║
# ╚══════════════════════════════════════════════╝

main:
  push:
    - name: sync-github
      docker:
        image: alpine/git:latest
      env:
        GITHUB_REPO: github.com/carolcoral/carolcoral
      stages:
        - name: push-mirror
          script: |
            echo ":: CNB → GitHub Mirror Sync ::"
            REPO_URL="https://${GITHUB_TOKEN}@${GITHUB_REPO}.git"
            # Strip CNB/CodeBuddy internal files before syncing to GitHub
            git rm -rf --cached .cnb .cnb.yml .codebuddy 2>/dev/null || true
            git commit -m "sync: exclude cnb internal configs" --allow-empty
            git remote add mirror ${REPO_URL} 2>/dev/null || git remote set-url mirror ${REPO_URL}
            echo "Pushing branches (excluding .cnb/ .cnb.yml .codebuddy/)..."
            git push mirror --all -f --prune
            echo "Pushing tags..."
            git push mirror --tags -f
            echo ":: Sync completed ::"

$:
  web_trigger_sync:
    - name: manual-sync-github
      docker:
        image: alpine/git:latest
      env:
        GITHUB_REPO: github.com/carolcoral/carolcoral
      stages:
        - name: force-push
          script: |
            echo ":: CNB → GitHub Manual Force Sync ::"
            REPO_URL="https://${GITHUB_TOKEN}@${GITHUB_REPO}.git"
            # Strip CNB/CodeBuddy internal files before syncing to GitHub
            git rm -rf --cached .cnb .cnb.yml .codebuddy 2>/dev/null || true
            git commit -m "sync: exclude cnb internal configs" --allow-empty
            git remote add mirror ${REPO_URL} 2>/dev/null || git remote set-url mirror ${REPO_URL}
            echo "Force pushing branches (excluding .cnb/ .cnb.yml .codebuddy/)..."
            git push mirror --all -f --prune
            echo "Force pushing tags..."
            git push mirror --tags -f
            echo ":: Manual sync completed ::"
